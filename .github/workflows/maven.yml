name: Java CI pipeline bmicheck
"on":
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: "27"
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn clean package
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: bmicheckv2.war
          path: "./target/bmicheckv2.war"
          if-no-files-found: error
        
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Production
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Download artifact from build job
      uses: actions/download-artifact@v7
      with:
        name: bmicheckv2.war
    - name: Azure CLI script
      uses: azure/cli@v2
      with:
        inlineScript: |
          az webapp deploy --src-path '${{ github.workspace }}/target/bmichevkv2.war' --name '${{ secrets.AZURE_WEBAPP_NAME }}' --resource-group '${{ secrets.RESOURCE_GROUP }}'  --async true --type war

