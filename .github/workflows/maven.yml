name: Java CI pipeline bmicheck
"on":
  push:
    branches:
      - main
env:
  TEMPLATE-FILE: infra/webapp.bicep
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: "27"
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn clean package
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: bmicheckv2.war
          path: "./target/bmicheckv2.war"
          if-no-files-found: error
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: bicep-template
          path: ${{ env.TEMPLATE-FILE }}
        
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Production
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    #Download the bicep templates from previous job
    - name: Download artifact from build job
      uses: actions/download-artifact@v6
      with:
        name: bicep-template
        path: bicep-template
    - name: Azure Login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Download artifact from build job
      uses: actions/download-artifact@v7
      with:
        name: bmicheckv2.war
    - name: Azure CLI script
      uses: azure/arm-deploy@v2
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ secrets.RESOURCE_GROUP }}
        template: bicep-template/webapp.bicep
        parameters: "webAppName=${{ secrets.AZURE_WEBAPP_NAME }} location=${{ secrets.RESOURCE_GROUP }}.location"
        failOnStdErr: false
    - name: Azure CLI script
      uses: azure/webapps-deploy@v3
      with:
        inlineScript: |
          az webapp create --resource-group '${{ secrets.RESOURCE_GROUP }}'  --name '${{ secrets.AZURE_WEBAPP_NAME }}' '${{ secrets.AZURE_APPSERVICE_PLAN_NAME }}' --runtime "JAVA:27" --container-image-name "TOMCAT:10.1"
    - name: Azure CLI script
      uses: azure/cli@v3
      with:
        inlineScript: |
          az webapp deploy --subscription f0147cad-bbee-4cae-908d-73f6b3ccc8d6 --src-path 'bmicheckv2.war' --name '${{ secrets.AZURE_WEBAPP_NAME }}' --resource-group '${{ secrets.RESOURCE_GROUP }}'  --async true --type war

